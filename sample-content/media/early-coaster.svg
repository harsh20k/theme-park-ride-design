<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="sans-serif" font-size="12">
  <title>Switchback railway, 1884</title>
  <desc>A hand-drawn style side view of a switchback railway: a wooden gravity car rolling down an undulating wooden track on a hill, with a tower at each end.</desc>
  <rect width="480" height="280" fill="#f6efe0"/>
  <path d="M0 250 Q120 236 240 246 T480 240 L480 280 L0 280 Z" fill="#dcd2b8" stroke="#8a7a5a" stroke-width="1.5"/>
  <path d="M30 70 C110 90 130 150 200 150 S260 118 320 150 S400 190 450 200" fill="none" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 76 C110 96 130 156 200 156 S260 124 320 156 S400 196 450 206" fill="none" stroke="#6b4a2b" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#8a6a44" stroke-width="2.5">
    <line x1="60" y1="80" x2="60" y2="250"/>
    <line x1="100" y1="100" x2="100" y2="248"/>
    <line x1="140" y1="128" x2="140" y2="246"/>
    <line x1="180" y1="150" x2="180" y2="246"/>
    <line x1="230" y1="144" x2="230" y2="246"/>
    <line x1="280" y1="132" x2="280" y2="246"/>
    <line x1="330" y1="158" x2="330" y2="244"/>
    <line x1="380" y1="180" x2="380" y2="244"/>
    <line x1="420" y1="192" x2="420" y2="242"/>
  </g>
  <g stroke="#a88a60" stroke-width="1.5">
    <line x1="60" y1="140" x2="100" y2="190"/>
    <line x1="100" y1="150" x2="140" y2="200"/>
    <line x1="180" y1="200" x2="230" y2="190"/>
    <line x1="280" y1="190" x2="330" y2="210"/>
    <line x1="330" y1="200" x2="380" y2="220"/>
  </g>
  <rect x="14" y="40" width="40" height="210" fill="#e8d9b8" stroke="#6b4a2b" stroke-width="2.5"/>
  <polygon points="10,40 34,22 58,40" fill="#c2566a" stroke="#6b4a2b" stroke-width="2.5"/>
  <rect x="440" y="190" width="34" height="60" fill="#e8d9b8" stroke="#6b4a2b" stroke-width="2.5"/>
  <polygon points="436,190 457,174 478,190" fill="#c2566a" stroke="#6b4a2b" stroke-width="2.5"/>
  <g transform="translate(120 106) rotate(34)">
    <rect x="-22" y="-16" width="44" height="14" rx="3" fill="#3f78b9" stroke="#1f3f66" stroke-width="2"/>
    <circle cx="-13" cy="1" r="4" fill="#333"/>
    <circle cx="13" cy="1" r="4" fill="#333"/>
    <circle cx="-8" cy="-21" r="4" fill="none" stroke="#1f3f66" stroke-width="2"/>
    <circle cx="8" cy="-21" r="4" fill="none" stroke="#1f3f66" stroke-width="2"/>
  </g>
  <text x="34" y="268" text-anchor="middle" fill="#6b4a2b">start tower</text>
  <text x="457" y="268" text-anchor="middle" fill="#6b4a2b">end tower</text>
  <text x="240" y="40" text-anchor="middle" fill="#6b4a2b" font-size="14">Switchback Railway, Coney Island, 1884</text>
  <text x="240" y="58" text-anchor="middle" fill="#8a7a5a">gravity does the work; attendants push the car back up</text>
</svg>
